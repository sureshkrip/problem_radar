[project]
name = "problem-radar"
version = "0.1.0"
description = "Private single-user tool that collects 'people have this problem' signals from the web, clusters, categorises, scores and triages them."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "google-play-scraper>=1.2",
]

[project.scripts]
radar = "pr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom relies on Depends()/Form() as argument defaults.
"pr/web/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
